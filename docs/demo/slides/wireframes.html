<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Wireframes Figma — LivresGourmands</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #F8F5EF; color: #252525;
      font-family: "Segoe UI", Arial, sans-serif; padding: 28px 36px 80px;
    }
    h1 { color: #214E3B; font-family: Georgia, serif; margin: 0 0 6px; font-size: 36px; }
    .meta { color: #5C5C5C; margin-bottom: 22px; font-size: 18px; }
    .link { color: #B45335; font-size: 15px; margin-bottom: 20px; word-break: break-all; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .card {
      background: #fff; border: 1px solid #DDD6C8; border-radius: 12px; overflow: hidden;
      box-shadow: 0 8px 20px rgba(33,78,59,.08);
    }
    .card h2 { font-size: 15px; margin: 0; padding: 10px 12px; background: #214E3B; color: #F8F5EF; }
    .pair { display: grid; grid-template-columns: 1.4fr 0.7fr; gap: 8px; padding: 10px; background: #f3efe7; }
    .pair img { width: 100%; height: 220px; object-fit: contain; background: #fff; border-radius: 6px; border: 1px solid #e5dfd3; }
    .lbl { font-size: 11px; color: #5C5C5C; text-align: center; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Wireframes Figma — 42 maquettes</h1>
  <p class="meta">Versions ordinateur (1440) et mobile (390) · Accueil, produit, panier, admin…</p>
  <p class="link">Lien réel : https://www.figma.com/design/nDpTL4OngsUY3hvtL7VznV</p>
  <div class="grid" id="grid"></div>
  <script>
    const pairs = [
      ['Desktop_01_accueil_Accueil.svg', 'Mobile_01_accueil_Accueil.svg', 'Accueil'],
      ['Desktop_05_fiche_ouvrage_Fiche_ouvrage.svg', 'Mobile_05_fiche_ouvrage_Fiche_ouvrage.svg', 'Fiche ouvrage'],
      ['Desktop_10_panier_Panier.svg', 'Mobile_10_panier_Panier.svg', 'Panier'],
      ['Desktop_12_saisie_code_personnel_Saisie_code_personnel.svg', 'Mobile_12_saisie_code_personnel_Saisie_code_personnel.svg', 'Code ami'],
      ['Desktop_18_dashboard_admin_Dashboard_admin.svg', 'Mobile_18_dashboard_admin_Dashboard_admin.svg', 'Dashboard admin'],
      ['Desktop_19_liste_ouvrages_admin_Liste_ouvrages_admin.svg', 'Mobile_19_liste_ouvrages_admin_Liste_ouvrages_admin.svg', 'Ouvrages admin'],
    ];
    const baseD = '../../../livrables/FIGMA_PRET_IMPORT/01_Desktop_1440/';
    const baseM = '../../../livrables/FIGMA_PRET_IMPORT/02_Mobile_390/';
    const grid = document.getElementById('grid');
    for (const [d, m, title] of pairs) {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `<h2>${title}</h2><div class="pair">
        <div><img src="${baseD}${d}" alt="${title} desktop" /><div class="lbl">Desktop</div></div>
        <div><img src="${baseM}${m}" alt="${title} mobile" /><div class="lbl">Mobile</div></div>
      </div>`;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
